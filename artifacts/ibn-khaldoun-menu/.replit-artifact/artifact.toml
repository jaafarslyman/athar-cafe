kind = "web"
previewPath = "/"
title = "Ibn Khaldoun Café Menu"
description = "An Arabic-first café menu and ordering app for Ibn Khaldoun. Guests browse dishes, place table orders, request service and bills; staff manage menu items and active dining sessions through a protected admin area."
version = "1.0.0"
id = "artifacts/ibn-khaldoun-menu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18823

[services.development]
run = "pnpm --filter @workspace/ibn-khaldoun-menu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ibn-khaldoun-menu", "run", "build" ]
serve = "static"
publicDir = "artifacts/ibn-khaldoun-menu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18823"
BASE_PATH = "/"
